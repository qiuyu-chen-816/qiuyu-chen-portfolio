<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3f6"/>
      <stop offset="0.55" stop-color="#ffdce6"/>
      <stop offset="1" stop-color="#f2d2e6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g opacity="0.48">
    <circle cx="170" cy="250" r="46" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -24; 0 0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="180" r="28" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 18; 0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="540" r="18" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="650" r="62" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -20; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="120" r="12" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 14; 0 0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="720" r="16" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0; 10 0; 0 0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="218" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="46" letter-spacing="1" fill="#8f3f5c">Hi, I'm Qiuyu Chen.</text>

  <circle cx="600" cy="400" r="170" fill="#ffffff" opacity="0.18">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="445" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'PingFang SC', sans-serif" font-weight="900" font-size="188" letter-spacing="2" fill="#5f2b45">
    <tspan>W<animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="1s" begin="0s" repeatCount="indefinite"/><animate attributeName="fill" values="#5f2b45;#d76f92;#5f2b45" dur="6s" repeatCount="indefinite"/></tspan>
    <tspan>e<animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="1s" begin="0.12s" repeatCount="indefinite"/><animate attributeName="fill" values="#5f2b45;#d76f92;#5f2b45" dur="6s" begin="0.12s" repeatCount="indefinite"/></tspan>
    <tspan>l<animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="1s" begin="0.24s" repeatCount="indefinite"/><animate attributeName="fill" values="#5f2b45;#d76f92;#5f2b45" dur="6s" begin="0.24s" repeatCount="indefinite"/></tspan>
    <tspan>c<animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="1s" begin="0.36s" repeatCount="indefinite"/><animate attributeName="fill" values="#5f2b45;#d76f92;#5f2b45" dur="6s" begin="0.36s" repeatCount="indefinite"/></tspan>
    <tspan>o<animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="1s" begin="0.48s" repeatCount="indefinite"/><animate attributeName="fill" values="#5f2b45;#d76f92;#5f2b45" dur="6s" begin="0.48s" repeatCount="indefinite"/></tspan>
    <tspan>m<animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="1s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="fill" values="#5f2b45;#d76f92;#5f2b45" dur="6s" begin="0.6s" repeatCount="indefinite"/></tspan>
    <tspan>e<animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="1s" begin="0.72s" repeatCount="indefinite"/><animate attributeName="fill" values="#5f2b45;#d76f92;#5f2b45" dur="6s" begin="0.72s" repeatCount="indefinite"/></tspan>
  </text>
</svg>
